<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-frame">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <span class="brand-mark"><mat-icon>lightbulb</mat-icon></span
      ><span>GlowControl</span>
    </div>
    <div class="workspace-label">WORKSPACE</div>
    <nav aria-label="Primary">
      <a routerLink="/bulbs" routerLinkActive="active" (click)="menuOpen.set(false)"
        ><mat-icon>lightbulb</mat-icon><span>Bulbs</span
        ><span class="nav-count">{{ bulbs().length }}</span></a
      ><a routerLink="/profiles" routerLinkActive="active" (click)="menuOpen.set(false)"
        ><mat-icon>tune</mat-icon><span>Profiles</span></a
      ><a routerLink="/control" routerLinkActive="active" (click)="menuOpen.set(false)"
        ><mat-icon>bolt</mat-icon><span>Control</span></a
      ><a routerLink="/settings" routerLinkActive="active" (click)="menuOpen.set(false)"
        ><mat-icon>settings</mat-icon><span>Settings</span></a
      >
    </nav>
  </aside>
  <div class="content-wrap">
    <main id="main-content" tabindex="-1"><router-outlet /></main>
  </div>
</div>

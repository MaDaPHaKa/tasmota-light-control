@if(result();as r){<section class="result" role="status"><strong>{{state()}}: {{r.summary.succeeded}} of {{r.summary.total}} targets succeeded</strong>@for(item of r.results;track item.bulbId){<div><span>{{item.bulbName}}</span><small>{{item.status}} · {{item.message}}</small></div>}@if(r.summary.failed){<button mat-stroked-button (click)="retryFailed.emit(r.results.filter(x=>x.status!=='success').map(x=>x.bulbId))">Retry failed targets</button>}</section>}

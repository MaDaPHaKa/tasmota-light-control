<div class="picker">
  <color-picker
    format="hex"
    [value]="value()"
    (valueChange)="updateFromPicker($event)"
    [hideAlpha]="true"
    [disabled]="disabled()"
  />
  @if (!hideText()) {
    <mat-form-field appearance="outline">
    <mat-label>Hex color</mat-label>
    <input
      #hexInput
      matInput
      [value]="value()"
      [disabled]="disabled()"
      (input)="updateFromText($any($event.target).value)"
      aria-describedby="rgb-format"
    />
    @if (errorMessage(); as message) {
      <mat-error>{{ message }}</mat-error>
    }
    <mat-hint id="rgb-format">Uppercase #RRGGBB</mat-hint>
    </mat-form-field>
  }
  @if (!hideSwatch()) {
    <span class="swatch" [style.background-color]="value()" aria-hidden="true"></span>
  }
</div>

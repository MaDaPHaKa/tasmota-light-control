<div class="picker">
  <color-picker
    format="hex"
    [value]="value()"
    (valueChange)="updateFromPicker($event)"
    [hideAlpha]="true"
    [disabled]="disabled()"
  />
  <mat-form-field appearance="outline">
    <mat-label>Hex color</mat-label>
    <input
      #hexInput
      matInput
      [value]="value()"
      [disabled]="disabled()"
      (input)="updateFromText($any($event.target).value)"
      aria-describedby="rgb-format"
    />
    <mat-hint id="rgb-format">Uppercase #RRGGBB</mat-hint>
  </mat-form-field>
  <span class="swatch" [style.background-color]="value()" aria-hidden="true"></span>
</div>

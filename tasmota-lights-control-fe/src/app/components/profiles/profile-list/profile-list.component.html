<div class="list">
  @for (profile of profiles(); track profile.id) {
    <article>
      <div class="profile-info">
        <strong>{{ profile.name }}</strong
        ><span
          >@if (profile.mode === 'rgb') {
            {{ profile.rgbColor }}
            <span
              class="color-swatch"
              [style.background-color]="profile.rgbColor"
              [attr.aria-label]="'RGB color ' + profile.rgbColor"
              [attr.title]="profile.rgbColor"
            ></span>
          } @else {
            {{ profile.colorTemperatureKelvin }} K
          } · {{ profile.dimmer }}%</span
        >
      </div>
      <div class="profile-actions">
        <button mat-button (click)="edit.emit(profile)">Edit</button
        ><button mat-button color="warn" (click)="delete.emit(profile)">Delete</button>
      </div>
    </article>
  }
</div>

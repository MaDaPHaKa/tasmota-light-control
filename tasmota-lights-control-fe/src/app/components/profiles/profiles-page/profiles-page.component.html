<app-page-header
  sectionEyebrow="CONFIGURATION"
  sectionName="Profiles"
  sectionDescription="Reusable light settings for quick, consistent control."
>
  <div class="actions-row" externalActions>
    <button mat-flat-button color="primary" (click)="toggleForm()">
      <mat-icon>add</mat-icon>New profile
    </button>
  </div>
</app-page-header>
@if (showForm()) {
  <section class="editor">
    <h2>{{ editing() ? 'Edit profile' : 'New profile' }}</h2>
    <app-profile-form
      [editing]="editing()"
      [pending]="pending()"
      [failure]="failure()"
      (fieldChanged)="clearField($event)"
      (save)="save($event)"
      (cancel)="showForm.set(false)"
    />
  </section>
} @else {
<section class="profile-grid">
  <app-profile-list [profiles]="profiles()" (edit)="edit($event)" (delete)="remove($event)" />
</section>
}

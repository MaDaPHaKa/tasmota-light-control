<form novalidate (submit)="$event.preventDefault(); onSubmit()">
  <fieldset>
    <mat-form-field appearance="outline"
      ><mat-label>Name</mat-label
      ><input #formControl matInput [formField]="profileForm.name" (input)="changed('name')" />
      @if (showClientError('name')) {
        <mat-error>{{ clientError('name') }}</mat-error>
      }
    </mat-form-field>
  </fieldset>
  <app-light-configuration
    [value]="model()"
    [disabled]="pending()"
    [errors]="{
      dimmer: showClientError('dimmer') ? clientError('dimmer') : null,
      mode: showClientError('mode') ? clientError('mode') : null,
      rgbColor: showClientError('rgbColor') ? clientError('rgbColor') : null,
      colorTemperatureKelvin: showClientError('colorTemperatureKelvin') ? clientError('colorTemperatureKelvin') : null
    }"
    (valueChange)="updateConfiguration($event)"
    (fieldChange)="configurationChanged($event)"
  />
  <div class="actions">
    <button mat-button type="button" (click)="cancel.emit()">Cancel</button
    ><button mat-flat-button color="primary" type="submit" [disabled]="pending() || profileForm().invalid()">
      {{ pending() ? 'Saving…' : 'Save profile' }}
    </button>
  </div>
</form>

<app-page-header
  sectionEyebrow="PREFERENCES"
  sectionName="Settings"
  sectionDescription="Set defaults used when resetting bulbs."
/>
<section class="settings-card">
  <h2>Reset defaults</h2>
  <p>These values apply when you reset one or more bulbs.</p>
  <form novalidate (submit)="$event.preventDefault(); save()">
    <app-light-configuration
      [value]="model()"
      [disabled]="pending()"
      [errors]="{
        dimmer: showClientError('dimmer') ? clientError('dimmer') : null,
        mode: showClientError('mode') ? clientError('mode') : null,
        rgbColor: showClientError('rgbColor') ? clientError('rgbColor') : null,
        colorTemperatureKelvin: showClientError('colorTemperatureKelvin') ? clientError('colorTemperatureKelvin') : null
      }"
      (valueChange)="updateConfiguration($event)"
      (fieldChange)="configurationChanged($event)"
    />
    <fieldset class="fade-settings">
       <legend>Fading</legend>
      <mat-form-field appearance="outline">
        <mat-label>Fade</mat-label>
        <input #formControl matInput type="number" placeholder="Optional" [formField]="settingsForm.fade" (input)="changed('fade')" />
        @if (showClientError('fade')) { <mat-error>{{ clientError('fade') }}</mat-error> }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Speed</mat-label>
        <input #formControl matInput type="number" placeholder="Optional" [formField]="settingsForm.speed" (input)="changed('speed')" />
        @if (showClientError('speed')) { <mat-error>{{ clientError('speed') }}</mat-error> }
      </mat-form-field>
    </fieldset>
    <div class="section-recap">
      <button mat-flat-button color="primary" type="submit" [disabled]="pending() || settingsForm().invalid()">
        {{ pending() ? 'Saving…' : 'Save      settings' }}
      </button>
    </div>
  </form>
</section>

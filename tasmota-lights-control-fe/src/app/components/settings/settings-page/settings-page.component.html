<section class="page-heading"><div><div class="eyebrow">CONFIGURATION / PREFERENCES</div><h1>Settings</h1><p>Set defaults used when resetting bulbs.</p></div></section><section class="settings-card"><h2>Reset defaults</h2><p>These values apply when you reset one or more bulbs.</p><form novalidate (submit)="$event.preventDefault(); save()"><mat-form-field appearance="outline"><mat-label>Dimmer</mat-label><input matInput type="number" [formField]="settingsForm.dimmer"></mat-form-field><mat-radio-group [formField]="settingsForm.mode"><mat-radio-button value="rgb">RGB</mat-radio-button><mat-radio-button value="color_temperature">Color temperature</mat-radio-button></mat-radio-group>@if(model().mode==='rgb'){<app-rgb-color-picker [(value)]="model().rgbColor" />}@else{<mat-form-field appearance="outline"><mat-label>Color temperature (Kelvin)</mat-label><input matInput type="number" [formField]="settingsForm.colorTemperatureKelvin"></mat-form-field>}<app-mode-preview [color]="model().rgbColor" [text]="model().mode==='rgb'?model().rgbColor:model().colorTemperatureKelvin+' K'" [dimmer]="model().dimmer"/><button mat-flat-button color="primary" type="submit">Save settings</button></form></section>

<div class="list">@for(bulb of bulbs();track bulb.id){<article><div><strong>{{bulb.name}}</strong><span>{{bulb.ipAddress}}:{{bulb.port}}</span></div><app-bulb-status [state]="statuses().get(bulb.id) ?? {kind:'idle'}" /><div class="actions"><button mat-button (click)="test.emit(bulb)">Test</button><button mat-icon-button aria-label="Edit bulb" (click)="edit.emit(bulb)"><mat-icon>edit</mat-icon></button><button mat-icon-button aria-label="Refresh status" (click)="refreshStatus.emit(bulb.id)"><mat-icon>refresh</mat-icon></button><button mat-icon-button aria-label="Delete bulb" (click)="delete.emit(bulb)"><mat-icon>delete</mat-icon></button></div></article>}</div>

<section class="page-heading"><div><div class="eyebrow">WORKSPACE / DEVICES</div><h1>Bulbs</h1><p>Manage connected Tasmota lights and monitor live status.</p></div><button mat-flat-button color="primary" (click)="toggleForm()"><mat-icon>add</mat-icon>{{showForm()?'Close':'Add bulb'}}</button></section>
@if(showForm()){<section class="quick-form"><h2>{{editing()?'Edit bulb':'Register bulb'}}</h2><app-bulb-form [editing]="editing()" [pending]="pending()" (save)="save($event)" (testEndpoint)="testEndpoint($event)" (cancel)="showForm.set(false)"/></section>}
<section class="device-section"><div class="section-header"><div><h2>All bulbs</h2><span class="muted">{{bulbs().length}} registered devices</span></div></div><app-bulb-list [bulbs]="bulbs()" [statuses]="statuses()" (edit)="edit($event)" (delete)="remove($event)" (test)="test($event)" (refreshStatus)="refresh($event)"/></section>

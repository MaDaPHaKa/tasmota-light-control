<div class="app-frame">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand"><span class="brand-mark"><mat-icon>lightbulb</mat-icon></span>
      <span>GlowControl</span>
    </div>
    <div class="workspace-label">WORKSPACE</div>
    <nav aria-label="Primary">
      <a routerLink="/bulbs" routerLinkActive="active"
        (click)="menuOpen.set(false)"><mat-icon>lightbulb</mat-icon><span>Bulbs</span><span
          class="nav-count">4</span></a>
      <a routerLink="/profiles" routerLinkActive="active"
        (click)="menuOpen.set(false)"><mat-icon>tune</mat-icon><span>Profiles</span></a>
      <a routerLink="/control" routerLinkActive="active"
        (click)="menuOpen.set(false)"><mat-icon>bolt</mat-icon><span>Control</span></a>
      <a routerLink="/settings" routerLinkActive="active"
        (click)="menuOpen.set(false)"><mat-icon>settings</mat-icon><span>Settings</span></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="connection"><span class="pulse"></span><span>Local network</span><strong>Connected</strong></div>
      <div class="version">GlowControl <span>v1.0.0</span></div>
    </div>
  </aside>
  <div class="content-wrap">
    <header class="topbar"><button mat-icon-button class="menu-button" (click)="menuOpen.update(v => !v)"
        aria-label="Toggle menu"><mat-icon>menu</mat-icon></button>
      <div class="topbar-title">Home / <strong>Bulbs</strong></div>
      <div class="topbar-actions"><span class="network"><span class="pulse"></span> Local network</span><button
          mat-icon-button matTooltip="Notifications"
          aria-label="Notifications"><mat-icon>notifications_none</mat-icon></button><span class="avatar">MC</span>
      </div>
    </header>
    <main id="main-content"><router-outlet /></main>
  </div>
</div>

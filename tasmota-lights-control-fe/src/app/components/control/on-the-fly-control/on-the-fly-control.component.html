<section class="on-the-fly-control panel">
  <div class="header">
    <h2>Set on-the-fly properties</h2>
  </div>

  <app-light-configuration
    [value]="configuration()"
    [disabled]="pending()"
    [compact]="true"
    (valueChange)="updateConfiguration($event)"
  />
  <div class="actions">
  <button class="submit" mat-flat-button color="primary" [disabled]="!valid()" (click)="submit()">
    <mat-icon>monitor_lighting</mat-icon>{{ pending() ? 'Working…' : 'Apply properties' }}
  </button>
  <button class="submit" mat-flat-button color="primary" [disabled]="!valid()" (click)="applyDimmer()">
    <mat-icon>brightness_6</mat-icon>{{ pending() ? 'Working…' : 'Apply dimmer' }}
  </button>
  </div>
</section>

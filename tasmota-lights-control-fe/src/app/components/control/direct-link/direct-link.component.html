<div class="link-form"><select (change)="selectBulb($event)" aria-label="Bulb"><option value="">Select bulb</option>@for(b of bulbs();track b.id){<option [value]="b.id">{{b.name}}</option>}</select><select (change)="selectProfile($event)" aria-label="Profile"><option value="">Select profile</option>@for(p of profiles();track p.id){<option [value]="p.id">{{p.name}}</option>}</select><button mat-flat-button color="primary" (click)="generate()">Generate link</button></div>@if(url()){<div class="result"><input readonly [value]="url()"><button mat-button (click)="copy()">Copy</button></div>}

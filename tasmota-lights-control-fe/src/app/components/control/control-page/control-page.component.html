<app-page-header
  sectionEyebrow="ACTIONS"
  sectionName="Control"
  sectionDescription="Apply profiles, set color and dimmer, or restore defaults across your bulbs."
/>
<div class="control-layout">
  <section class="bulb-selection panel">
    <div class="bulb-selection__header">
      <h2>Bulbs</h2>
      <div class="selection-actions">
        <button mat-button type="button" (click)="selectAll()">Select all</button>
        <button mat-button type="button" (click)="clearAll()">Clear all</button>
      </div>
    </div>
    <fieldset>
      @for (bulb of bulbs(); track bulb.id) {
        <mat-checkbox [checked]="selectedBulbs().has(bulb.id)" (change)="toggleBulb(bulb.id)"
          >{{ bulb.name }} <span>{{ bulb.ipAddress }}</span></mat-checkbox
        >
      }
    </fieldset>
  </section>
  <app-profile-control
    class="profile-control-panel"
    [profiles]="profiles()"
    [selectedProfile]="selectedProfile()"
    [selectedBulbCount]="selectedBulbs().size"
    [pending]="pending()"
    (profileSelected)="chooseProfile($event)"
    (applyProfile)="apply()"
  />
  <app-on-the-fly-control
    class="on-the-fly-control-panel"
    [selectedBulbCount]="selectedBulbs().size"
    [pending]="pending()"
    (setProperties)="setProperties($event)"
  />
  <app-reset-bulbs
    class="reset-bulbs-row"
    [bulbCount]="bulbs().length"
    [selectedBulbCount]="selectedBulbs().size"
    [pending]="pending()"
    (resetSelected)="reset()"
    (resetAll)="resetAll()"
  />
</div>

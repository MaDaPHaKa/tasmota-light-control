[package]
name = "tasmota-lights-control"
version = "0.1.0"
edition = "2024"

[profile.release] 
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
axum = { version = "~0.8.9", features = ["json"] }
clap = { version = "~4.6.7", features = ["derive"] }
futures-util = "~0.3.34"
ipnet = "~2.12.2"
reqwest = { version = "~0.12.28", default-features = false, features = ["http2", "charset", "stream"] }
rusqlite = { version = "~0.32.1", features = ["bundled"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.154"
thiserror = "~2.0.21"
tokio = { version = "~1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "~0.8.23"
time = { version = "~0.3.55", features = ["formatting", "parsing"] }
tower-http = { version = "~0.6.11", features = ["limit", "request-id", "trace"] }
tracing = "~0.1.44"
tracing-subscriber = { version = "~0.3.23", features = ["env-filter"] }
url = "~2.5.8"
uuid = { version = "~1.29.0", features = ["v4", "serde"] }

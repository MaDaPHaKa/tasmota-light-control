[package]
name = "tasmota-lights-control"
version = "0.1.0"
edition = "2024"

[profile.release] 
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
ipnet = "2.10"
reqwest = { version = "0.12", default-features = false, features = ["http2", "charset", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
tower-http = { version = "0.6", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4", "serde"] }
